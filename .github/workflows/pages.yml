name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check game.js
          node --check model-renderer.js
          node --check ring-renderer.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  browser-smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Launch game and test live controls
        env:
          GAME_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            const page = await browser.newPage({viewport:{width:1280,height:900},deviceScaleFactor:1});
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto(process.env.GAME_URL, {waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('#you canvas.polygon3d', {timeout:20000});
            const render = await page.locator('#you canvas.polygon3d').evaluate(canvas => ({
              visible: getComputedStyle(canvas).visibility !== 'hidden' && canvas.getBoundingClientRect().width > 0,
              width: canvas.width, height: canvas.height,
              webgl: !!canvas.getContext('webgl')
            }));
            if (!render.visible || !render.width || !render.height || !render.webgl) throw new Error('Player WebGL renderer did not initialize: '+JSON.stringify(render));
            await page.screenshot({path:'artifacts/01-fighter-select.png',fullPage:true});
            await page.locator('#enter-ring').click();
            await page.waitForTimeout(1900);
            await page.locator('[data-a="jab"]').click();
            await page.waitForTimeout(450);
            await page.locator('[data-a="left"]').click();
            await page.waitForTimeout(350);
            const status = await page.locator('#status').innerText();
            const layout = await page.evaluate(() => {
              const arena = document.querySelector('.arena').getBoundingClientRect();
              const rival = document.querySelector('#foe').getBoundingClientRect();
              const player = document.querySelector('#you').getBoundingClientRect();
              const playerCanvas = document.querySelector('#you canvas.polygon3d').getBoundingClientRect();
              const rivalCanvas = document.querySelector('#foe canvas.polygon3d').getBoundingClientRect();
              return {arena:{top:arena.top,bottom:arena.bottom},rival:{top:rival.top,bottom:rival.bottom,width:rival.width,height:rival.height},player:{top:player.top,bottom:player.bottom,width:player.width,height:player.height},canvases:{player:{top:playerCanvas.top,bottom:playerCanvas.bottom,width:playerCanvas.width,height:playerCanvas.height},rival:{top:rivalCanvas.top,bottom:rivalCanvas.bottom,width:rivalCanvas.width,height:rivalCanvas.height}},verticalGap:player.top-rival.bottom,renderedGap:playerCanvas.top-rivalCanvas.bottom};
            });
            if (!(layout.rival.top < layout.player.top && layout.verticalGap > 0 && layout.rival.height > 100 && layout.player.height > 150 && layout.rival.bottom < layout.arena.bottom && layout.player.top > layout.arena.top)) throw new Error('Fighter lanes overlap or are outside the ring: '+JSON.stringify(layout));
            if (layout.canvases.player.width < 100 || layout.canvases.rival.width < 100 || layout.canvases.player.height < 100 || layout.canvases.rival.height < 100) throw new Error('One boxer canvas is too small: '+JSON.stringify(layout));
            if (layout.renderedGap < 100) throw new Error('Rendered boxer canvases do not have a clearly visible center gap: '+JSON.stringify(layout));
            await page.screenshot({path:'artifacts/02-live-gameplay.png',fullPage:true});
            if (errors.length) throw new Error('Browser JavaScript errors: '+errors.join(' | '));
            console.log(JSON.stringify({url:process.env.GAME_URL,render,layout,status,errors,screenshots:['01-fighter-select.png','02-live-gameplay.png']},null,2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-knockout-live-browser-test
          path: artifacts/
          retention-days: 14

name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check game.js
          node --check model-renderer.js
          node --check ring-renderer.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  browser-smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Launch game and test desktop and mobile gameplay
        env:
          GAME_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            const page = await browser.newPage({viewport:{width:1280,height:900},deviceScaleFactor:1});
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto(process.env.GAME_URL, {waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('#you canvas.polygon3d', {timeout:20000});
            const render = await page.locator('#you canvas.polygon3d').evaluate(canvas => ({
              visible: getComputedStyle(canvas).visibility !== 'hidden' && canvas.getBoundingClientRect().width > 0,
              width: canvas.width, height: canvas.height,
              webgl: !!canvas.getContext('webgl')
            }));
            if (!render.visible || !render.width || !render.height || !render.webgl) throw new Error('Player WebGL renderer did not initialize: '+JSON.stringify(render));
            await page.screenshot({path:'artifacts/01-fighter-select-desktop.png',fullPage:true});
            await page.locator('#enter-ring').click();
            await page.waitForTimeout(1900);
            await page.locator('[data-a="jab"]').click();
            await page.waitForTimeout(1250);
            await page.locator('[data-a="left"]').click();
            await page.waitForTimeout(350);
            const desktop = await page.evaluate(() => {
              const arena = document.querySelector('.arena').getBoundingClientRect();
              const rival = document.querySelector('#foe').getBoundingClientRect();
              const player = document.querySelector('#you').getBoundingClientRect();
              const playerCanvas = document.querySelector('#you canvas.polygon3d').getBoundingClientRect();
              const rivalCanvas = document.querySelector('#foe canvas.polygon3d').getBoundingClientRect();
              const referee = document.querySelector('.pixel-referee');
              return {arena:{top:arena.top,bottom:arena.bottom},rival:{top:rival.top,bottom:rival.bottom,width:rival.width,height:rival.height},player:{top:player.top,bottom:player.bottom,width:player.width,height:player.height},canvases:{player:{top:playerCanvas.top,bottom:playerCanvas.bottom,width:playerCanvas.width,height:playerCanvas.height},rival:{top:rivalCanvas.top,bottom:rivalCanvas.bottom,width:rivalCanvas.width,height:rivalCanvas.height}},verticalGap:player.top-rival.bottom,renderedGap:playerCanvas.top-rivalCanvas.bottom,refereeOpacity:referee?getComputedStyle(referee).opacity:null,refereePresent:!!referee,legacyBoxerParts:document.querySelectorAll('.arena > .torso, .arena > .shorts, .arena > .arm, .arena > .glove, .arena > .leg').length,svgFallbacks:document.querySelectorAll('.fighter>.boxer-art').length,backgroundImages:[getComputedStyle(document.querySelector('#you')).backgroundImage,getComputedStyle(document.querySelector('#foe')).backgroundImage],calloutText:document.querySelector('#callout').textContent};
            });
            if (!(desktop.rival.top < desktop.player.top && desktop.verticalGap > 0 && desktop.rival.height > 100 && desktop.player.height > 150 && desktop.rival.bottom < desktop.arena.bottom && desktop.player.top > desktop.arena.top)) throw new Error('Desktop fighter lanes overlap or leave the ring: '+JSON.stringify(desktop));
            if (desktop.canvases.player.width < 100 || desktop.canvases.rival.width < 100 || desktop.canvases.player.height < 100 || desktop.canvases.rival.height < 100 || desktop.renderedGap < 50) throw new Error('Desktop WebGL fighter framing is too small or overlapping: '+JSON.stringify(desktop));
            if (desktop.refereePresent || desktop.legacyBoxerParts !== 0 || desktop.svgFallbacks !== 0 || desktop.backgroundImages.some(value=>value!=='none')) throw new Error('An extra character or callout remains during ordinary combat: '+JSON.stringify(desktop));
            await page.screenshot({path:'artifacts/02-live-gameplay-desktop.png',fullPage:true});
            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('#you canvas.polygon3d', {timeout:20000});
            await page.locator('#enter-ring').click();
            await page.waitForTimeout(3200);
            const mobile = await page.evaluate(() => {
              const arena = document.querySelector('.arena').getBoundingClientRect();
              const rival = document.querySelector('#foe').getBoundingClientRect();
              const player = document.querySelector('#you').getBoundingClientRect();
              const pc = document.querySelector('#you canvas.polygon3d').getBoundingClientRect();
              const rc = document.querySelector('#foe canvas.polygon3d').getBoundingClientRect();
              return {arena:{top:arena.top,bottom:arena.bottom},rival:{top:rival.top,bottom:rival.bottom,width:rival.width,height:rival.height},player:{top:player.top,bottom:player.bottom,width:player.width,height:player.height},renderedGap:pc.top-rc.bottom,refereePresent:!!document.querySelector('.pixel-referee')};
            });
            if (!(mobile.rival.top < mobile.player.top && mobile.player.top-mobile.rival.bottom > 0 && mobile.rival.bottom < mobile.arena.bottom && mobile.player.bottom <= mobile.arena.bottom+2)) throw new Error('Mobile fighter lanes overlap or leave the ring: '+JSON.stringify(mobile));
            if (mobile.renderedGap < 20 || mobile.refereePresent || document.querySelectorAll('.fighter>.boxer-art').length !== 0 || [...document.querySelectorAll('.fighter')].some(el=>getComputedStyle(el).backgroundImage!=='none')) throw new Error('Mobile fighter framing or clean combat view failed: '+JSON.stringify(mobile));
            await page.screenshot({path:'artifacts/03-live-gameplay-mobile.png',fullPage:true});
            if (errors.length) throw new Error('Browser JavaScript errors: '+errors.join(' | '));
            console.log(JSON.stringify({url:process.env.GAME_URL,render,desktop,mobile,errors,screenshots:['01-fighter-select-desktop.png','02-live-gameplay-desktop.png','03-live-gameplay-mobile.png']},null,2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-knockout-live-browser-test
          path: artifacts/
          retention-days: 14

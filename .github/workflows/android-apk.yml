name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: npm install
      - name: Check game JavaScript
        run: npm run check
      - name: Prepare Android web assets
        run: |
          mkdir -p www
          cp index.html game.js styles.css manifest.webmanifest service-worker.js ring-renderer.js model-renderer.js www/
          test -s www/ring-renderer.js
          test -s www/model-renderer.js
      - name: Generate Android project
        run: npx cap add android
      - name: Sync game into Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: super-knockout-world-tour-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Capture real gameplay screenshot
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'game.js'
      - 'assets/**'
      - '.github/workflows/game-screenshot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gameplay-screenshot
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture live fight screen
        run: |
          mkdir -p screenshots
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/game-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 540, height: 960 },
              deviceScaleFactor: 2, // Full HD portrait capture: 1080 x 1920
              isMobile: true,
              hasTouch: true
            });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('http://127.0.0.1:4173', { waitUntil: 'networkidle' });
            await page.locator('#enter-ring').click();
            await page.waitForTimeout(3300);
            await page.screenshot({ path: 'screenshots/gameplay.png', fullPage: false });
            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload live gameplay screenshot
        uses: actions/upload-artifact@v4
        with:
          name: live-gameplay-screenshot
          path: screenshots/gameplay.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/gameplay.png
          git commit -m "Add automated gameplay screenshot" || exit 0
          git pull --rebase origin main
          git push
